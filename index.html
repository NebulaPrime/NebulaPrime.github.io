<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小壮想珠中</title>
<meta name="description" content="高卓然的小角落">
<meta name="theme-color" content="#fdf6ee">
<style>
  :root{
    --fg:#4a3426;
    --dim:#a8856b;
    --accent:#e8805e;
    --line:rgba(232,128,94,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:radial-gradient(circle at 50% 20%, #fffdf9 0%, #fdf1e4 46%, #f8e0cd 100%);
    color:var(--fg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:grid;
    place-items:center;
    min-height:100svh;
    padding:32px 24px;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* 暖光晕 */
  body::before{
    content:"";
    position:fixed;
    width:min(80vmax,980px);height:min(80vmax,980px);
    left:50%;top:46%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,214,186,.55), transparent 62%);
    pointer-events:none;
  }
  /* 暖色小点点 */
  body::after{
    content:"";
    position:fixed;inset:0;
    background-image:radial-gradient(rgba(214,163,128,.28) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 70%);
            mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 70%);
    opacity:.55;
    pointer-events:none;
  }
  main{
    position:relative;
    text-align:center;
    max-width:680px;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.22em;
    color:#b08a6e;
    border:1px solid rgba(214,163,128,.45);
    background:rgba(255,251,246,.7);
    border-radius:999px;
    padding:7px 16px;
    margin-bottom:36px;
  }
  .badge-icon{width:12px;height:12px;color:#e8a87c}

  h1{
    font-size:clamp(34px,9vw,62px);
    font-weight:600;
    letter-spacing:.10em;
    line-height:1.1;
    background:linear-gradient(180deg,#6b4a33 0%,#a3714d 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .sub{
    margin-top:14px;
    font-size:13px;
    letter-spacing:.30em;
    color:#b5967d;
  }
  .line{
    margin:34px auto 0;
    width:72px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,128,94,.55),transparent);
  }
  .note{
    margin-top:34px;
    font-size:17px;
    line-height:1.9;
    color:#6b4f3a;
    letter-spacing:.02em;
  }

  /* 小猪：轻微浮动 + 眨眼 */
  .pig{
    display:inline-block;
    width:44px;height:44px;
    margin-left:10px;
    vertical-align:-11px;
    animation:float 3s ease-in-out infinite;
    filter:drop-shadow(0 3px 6px rgba(232,128,94,.22));
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-5px)}
  }
  .pig .eye{transform-origin:center;animation:blink 5.2s infinite}
  @keyframes blink{
    0%,94%,100%{transform:scaleY(1)}
    96%{transform:scaleY(.12)}
  }

  footer{
    position:fixed;
    left:0;right:0;bottom:26px;
    display:flex;justify-content:center;gap:26px;
    font-size:12px;
    letter-spacing:.05em;
    color:#bda998;
  }
  footer a{
    color:#bda998;
    text-decoration:none;
    transition:color .2s ease;
  }
  footer a:hover{color:var(--accent)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
<main>
  <div class="status">
    <svg class="badge-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2 2.4 11.4h2.9V21h5.2v-5.6h3v5.6h5.2v-9.6h2.9z"/></svg>
    小壮的窝
  </div>
  <h1>小壮想珠中</h1>
  <div class="sub">高卓然 · ZHUORAN GAO</div>
  <div class="line"></div>
  <p class="note">周六见<svg class="pig" viewBox="0 0 72 72" aria-label="小猪" role="img">
    <path d="M19 21q-3-13 8-11 6 2 6 10z" fill="#ffc2cf"/>
    <path d="M53 21q3-13-8-11-6 2-6 10z" fill="#ffc2cf"/>
    <ellipse cx="36" cy="41" rx="23" ry="20" fill="#ffd4dd"/>
    <ellipse cx="19" cy="47" rx="5.2" ry="3.6" fill="#ffa8bb" opacity=".65"/>
    <ellipse cx="53" cy="47" rx="5.2" ry="3.6" fill="#ffa8bb" opacity=".65"/>
    <circle class="eye" cx="27" cy="35" r="2.7" fill="#5a3b45"/>
    <circle class="eye" cx="45" cy="35" r="2.7" fill="#5a3b45"/>
    <ellipse cx="36" cy="46" rx="10" ry="7.6" fill="#ffb0c0"/>
    <ellipse cx="32.4" cy="46" rx="1.8" ry="2.4" fill="#d9657f"/>
    <ellipse cx="39.6" cy="46" rx="1.8" ry="2.4" fill="#d9657f"/>
  </svg></p>
</main>
<footer>
  <a href="https://github.com/NebulaPrime" target="_blank" rel="noopener">GitHub</a>
  <span>gaozhuoran.com</span>
</footer>
</body>
</html>
