<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula Prime</title>
<meta name="description" content="高卓然的赛博空间">
<meta name="theme-color" content="#07080b">
<style>
  :root{
    --bg:#07080b;
    --fg:#e7e9f0;
    --dim:#767d92;
    --accent:#5eead4;
    --grid:rgba(94,234,212,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    display:grid;
    place-items:center;
    min-height:100svh;
    padding:32px 24px;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* 网格 */
  body::before{
    content:"";
    position:fixed;inset:-1px;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 72%);
            mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 72%);
    pointer-events:none;
  }
  /* 光晕 */
  body::after{
    content:"";
    position:fixed;
    width:min(74vmax,900px);height:min(74vmax,900px);
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(94,234,212,.08),transparent 62%);
    pointer-events:none;
  }
  main{
    position:relative;
    text-align:center;
    max-width:660px;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);
    border:1px solid rgba(94,234,212,.22);
    border-radius:999px;
    padding:7px 14px;
    margin-bottom:38px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  h1{
    font-size:clamp(34px,9vw,64px);
    font-weight:600;
    letter-spacing:.06em;
    line-height:1.1;
    background:linear-gradient(180deg,#fff 0%,#9fb3c8 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .sub{
    margin-top:14px;
    font-size:13px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .line{
    margin:38px auto 0;
    width:64px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(94,234,212,.55),transparent);
  }
  .note{
    margin-top:38px;
    font-size:15px;
    line-height:1.9;
    color:#c3c9d8;
  }
  .note .cursor{
    display:inline-block;
    width:8px;height:17px;
    margin-left:6px;
    vertical-align:-2px;
    background:var(--accent);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .heart{
    display:inline-block;
    width:16px;height:16px;
    margin-left:10px;
    vertical-align:-2px;
    color:#ff7aa2;
    fill:currentColor;
    filter:drop-shadow(0 0 8px rgba(255,122,162,.55));
    animation:beat 1.8s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{transform:scale(1)}
    12%{transform:scale(1.16)}
    24%{transform:scale(1)}
    36%{transform:scale(1.10)}
    48%{transform:scale(1)}
  }

  footer{
    position:fixed;
    left:0;right:0;bottom:26px;
    display:flex;
    justify-content:center;
    gap:26px;
    font-size:12px;
    letter-spacing:.05em;
    color:#5a6072;
  }
  footer a{
    color:#5a6072;
    text-decoration:none;
    transition:color .2s ease;
  }
  footer a:hover{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
<main>
  <div class="status"><span class="dot"></span>Under Construction</div>
  <h1>NEBULA PRIME</h1>
  <div class="sub">高卓然 · Zhuoran Gao</div>
  <div class="line"></div>
  <p class="note">晚安，我是爱珠的小壮<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></p>
</main>
<footer>
  <a href="https://github.com/NebulaPrime" target="_blank" rel="noopener">GitHub</a>
  <span>gaozhuoran.com</span>
</footer>
</body>
</html>
