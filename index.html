<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小珠锻炼中</title>
<meta name="description" content="小珠锻炼中">
<meta name="theme-color" content="#bfe4ff">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#bfe4ff;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  .stage{position:relative;width:100%;height:100svh;overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;display:block}

  h1{
    position:absolute;
    top:7%;
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(26px,6vw,52px);
    font-weight:800;
    letter-spacing:.10em;
    color:#fff;
    text-shadow:
      0 2px 0 rgba(120,160,200,.35),
      0 10px 26px rgba(90,150,200,.35);
    white-space:nowrap;
    z-index:2;
  }

  /* 仰卧起坐：上身绕臀点起来又躺下 */
  .crunch{transform-origin:16px -32px;animation:crunch 2.2s ease-in-out infinite}
  @keyframes crunch{
    0%,100%{transform:rotate(10deg)}
    50%{transform:rotate(-4deg)}
  }
  .cloud{animation:drift 26s linear infinite}
  @keyframes drift{
    from{transform:translateX(0)}
    to{transform:translateX(46px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
<div class="stage">
<svg class="bg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecbff"/>
      <stop offset="55%" stop-color="#c3e7ff"/>
      <stop offset="100%" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7e089"/>
      <stop offset="100%" stop-color="#6cc353"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f29269"/>
      <stop offset="100%" stop-color="#df7150"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#ffe680" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#ff8db8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#sky)"/>

  <circle cx="822" cy="118" r="130" fill="url(#sunGlow)"/>
  <circle cx="822" cy="118" r="46" fill="#ffd93d"/>

  <g class="cloud" fill="#ffffff" opacity=".95">
    <ellipse cx="196" cy="132" rx="54" ry="26"/>
    <ellipse cx="236" cy="120" rx="39" ry="31"/>
    <ellipse cx="160" cy="124" rx="35" ry="22"/>
  </g>
  <g class="cloud" fill="#ffffff" opacity=".8" style="animation-delay:-9s">
    <ellipse cx="742" cy="228" rx="46" ry="20"/>
    <ellipse cx="774" cy="218" rx="30" ry="22"/>
    <ellipse cx="712" cy="220" rx="26" ry="16"/>
  </g>

  <g>
    <rect x="120" y="352" width="13" height="66" fill="#a8764f"/>
    <circle cx="126" cy="338" r="52" fill="#77c25f"/>
    <circle cx="92" cy="352" r="34" fill="#89cf6e"/>
    <circle cx="162" cy="354" r="32" fill="#6fb857"/>
    <rect x="888" y="360" width="12" height="58" fill="#a8764f"/>
    <circle cx="894" cy="342" r="44" fill="#7ec766"/>
  </g>

  <rect y="392" width="1000" height="308" fill="url(#grass)"/>

  <path d="M0 468 Q 500 428 1000 468 L1000 566 Q 500 526 0 566 Z" fill="url(#track)"/>
  <path d="M0 517 Q 500 477 1000 517" stroke="#ffffff" stroke-width="3"
        stroke-dasharray="26 20" fill="none" opacity=".75"/>
  <path d="M0 566 Q 500 526 1000 566" stroke="#ffffff" stroke-width="4" fill="none" opacity=".55"/>

  <g fill="#5cb443" opacity=".85">
    <path d="M60 640 q6 -26 12 0 q6 -26 12 0z"/>
    <path d="M190 668 q6 -24 11 0 q6 -24 11 0z"/>
    <path d="M840 650 q6 -26 12 0 q6 -26 12 0z"/>
    <path d="M930 682 q6 -22 11 0 q6 -22 11 0z"/>
  </g>

  <!-- 小猪：瑜伽垫上做仰卧起坐 -->
  <g transform="translate(500 604) scale(0.95)">
  <g class="pig">
    <ellipse cx="10" cy="0" rx="140" ry="14" fill="#4a7a3a" opacity=".16"/>

    <!-- 瑜伽垫 -->
    <ellipse cx="10" cy="-11" rx="140" ry="21" fill="#ff8db8"/>
    <ellipse cx="10" cy="-16" rx="135" ry="16" fill="url(#mat)"/>
    <ellipse cx="10" cy="-20" rx="120" ry="9" fill="#ffd0e2" opacity=".5"/>

    <g class="crunch">
      <!-- 腿：大腿向斜上、小腿踩地，膝盖在身体前方 -->
      <path d="M22 -36 L 78 -80" stroke="#ffd4dd" stroke-width="31"
            stroke-linecap="round" fill="none"/>
      <path d="M78 -80 L 68 -36" stroke="#ffd4dd" stroke-width="29"
            stroke-linecap="round" fill="none"/>
      <ellipse cx="66" cy="-32" rx="19" ry="10" fill="#ff7fa5"/>

      <!-- 躯干：从臀部向左上抬起 -->
      <path d="M24 -38 L -16 -82" stroke="#ffd4dd" stroke-width="52"
            stroke-linecap="round" fill="none"/>
      <!-- 运动短裤 -->
      <path d="M44 -46 q-28 4 -38 22 q10 20 34 14 q12 -16 4 -36z" fill="#ff8fb0"/>

      <!-- 抱头的手臂 -->
      <path d="M-18 -78 Q -38 -102 -42 -118" stroke="#ffd4dd" stroke-width="17"
            stroke-linecap="round" fill="none"/>

      <!-- 头 -->
      <g transform="translate(-28 -100) rotate(-14)">
        <g transform="scale(0.9)">
          <!-- 蝴蝶结 -->
          <g transform="translate(0 -62)">
            <path d="M-7 0 l-27 -13 v26 z" fill="#ff6f9c"/>
            <path d="M7 0 l27 -13 v26 z" fill="#ff6f9c"/>
            <circle cx="0" cy="0" r="8.5" fill="#ff4f86"/>
          </g>

          <!-- 耳朵 -->
          <ellipse cx="-37" cy="-30" rx="18" ry="16" fill="#ffb8c9" transform="rotate(-20 -37 -30)"/>
          <ellipse cx="37" cy="-30" rx="18" ry="16" fill="#ffb8c9" transform="rotate(20 37 -30)"/>

          <!-- 脸 -->
          <circle cx="0" cy="0" r="51" fill="#ffd4dd"/>

          <!-- 腮红 -->
          <ellipse cx="-33" cy="18" rx="13" ry="8" fill="#ff9eb5" opacity=".5"/>
          <ellipse cx="33" cy="18" rx="13" ry="8" fill="#ff9eb5" opacity=".5"/>

          <!-- 眼睛（用力眯起来） -->
          <g>
            <path d="M-27 -6 q8 7 16 0" stroke="#3e2a33" stroke-width="4.2"
                  fill="none" stroke-linecap="round"/>
            <path d="M-29 -13 q-5.5 -4.5 -9 -1.5" stroke="#3e2a33" stroke-width="2.6"
                  fill="none" stroke-linecap="round"/>
          </g>
          <g>
            <path d="M11 -6 q8 7 16 0" stroke="#3e2a33" stroke-width="4.2"
                  fill="none" stroke-linecap="round"/>
            <path d="M29 -13 q5.5 -4.5 9 -1.5" stroke="#3e2a33" stroke-width="2.6"
                  fill="none" stroke-linecap="round"/>
          </g>

          <!-- 鼻子 -->
          <ellipse cx="0" cy="19" rx="15" ry="11" fill="#ffb0c0"/>
          <ellipse cx="-5" cy="19" rx="2.5" ry="3.5" fill="#d9657f"/>
          <ellipse cx="5" cy="19" rx="2.5" ry="3.5" fill="#d9657f"/>

          <!-- 小嘴（用力咬牙） -->
          <path d="M-8 34 q4 -4 8 0 q4 4 8 0" stroke="#d9657f" stroke-width="2.9"
                fill="none" stroke-linecap="round"/>

          <!-- 汗珠 -->
          <path d="M57 -16 q-7.5 11 0 15 q7.5 -4 0 -15z" fill="#7fc4f5"/>
          <path d="M-59 -6 q-6.5 9 0 13 q6.5 -4 0 -13z" fill="#7fc4f5" opacity=".85"/>
        </g>
      </g>
    </g>
  </g>
  </g>
</svg>

  <h1>小珠锻炼中</h1>
</div>
</body>
</html>
